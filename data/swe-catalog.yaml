# SWE Catalog — NPR 7150.2D Appendix C, Requirements Mapping Matrix
# Coverage: Appendix C pages 56-78, sections 3.1 through 5.5 (94 of the appendix's 100 rows).
# See CATALOG-COVERAGE.md for the gap (§4.1 only).
#
# Column semantics, per Appendix C's table header:
#   class_ae_authority — the "Class A-E Authority" column (tailoring approval authority for Classes A-E)
#   classes            — the six per-class applicability columns ("X" = invoked, blank = not invoked)
#   class_f_authority  — the "Class F Authority" column; per NPR 7150.2D §2.1.5.4 the NASA/Center CIO
#                        holds institutional authority on all Class F software projects, so this reads
#                        "CIO" wherever Appendix C names an authority, and null where the cell is
#                        blank. The cell is blank on every row without a Class F mark, and also on
#                        §3.2.1/SWE-015, which carries a Class F mark with no named authority — that
#                        blank is in the source standard, not a transcription slip. See
#                        CATALOG-COVERAGE.md.
#
# Rows are in Appendix C order. The Class A-E Authority column is transcribed verbatim, including
# the multi-line values ("Center and Center CIO", "HQ OCE and HQ OSMA").
